name: Push Frontend to AWS ECR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:

  workflow_run:
    workflows: ["Push Backend to AWS ECR"]
    types: [completed] 
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get Backend Public IP
      id: get-ip
      run: |
        sleep 90
        # Get the Task ARN
        TASK_ARN=$(aws ecs list-tasks --cluster ygo-cluster --service ygowebapp-service-4pntnyu7 --desired-status RUNNING --query "taskArns[0]" --output text )
        
        # Get the Public IP from the Network Interface
        ENI_ID=$(aws ecs describe-tasks --cluster ygo-cluster --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
        PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query "NetworkInterfaces[0].Association.PublicIp" --output text)
        echo "ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
        echo "DEBUG: Backend Public ip is: $PUBLIC_IP and ARN: $TASK_ARN"

    - name: Build, tag, and push Frontend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ygo-frontend
        IMAGE_TAG: ${{ github.sha }}
        # VITE_API_URL: http://$PUBLIC_IP:8000  
        # VITE_S3_URL: https://ygo-cards-images-dennis2002k.s3.eu-north-1.amazonaws.com/
      run: |
        docker build \
        --build-arg VITE_API_URL=http://${{ steps.get-ip.outputs.ip }}:8000 \
          --build-arg VITE_S3_URL=https://ygo-cards-images-dennis2002k.s3.eu-north-1.amazonaws.com/ \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./frontend
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

    - name: Deploy to ECS
      run: |
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY=ygo-frontend
        IMAGE_TAG=${{ github.sha }}

        # 1. Get the current task definition
        TASK_DEF=$(aws ecs describe-task-definition --task-definition ygo-frontend-task)
        
        # 2. Create a new revision with the NEW image tag
        NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
          '.taskDefinition | .containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
        
        # 3. Register the new revision
        NEW_REVISION=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query "taskDefinition.taskDefinitionArn" --output text)
        aws ecs update-service --cluster ygo-cluster --service ygo-frontend-task-service-9vcaad0m --task-definition $NEW_REVISION --force-new-deployment


    - name: Get Frontend Public IP
      id: get-frontend-ip
      run: |
        sleep 90
        # Get the Task ARN
        TASK_ARN=$(aws ecs list-tasks --cluster ygo-cluster --service ygo-frontend-task-service-9vcaad0m --desired-status RUNNING --query "taskArns[0]" --output text )
        
        # Get the Public IP from the Network Interface
        ENI_ID=$(aws ecs describe-tasks --cluster ygo-cluster --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
        PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query "NetworkInterfaces[0].Association.PublicIp" --output text)
        echo "frontendIp=$PUBLIC_IP" >> $GITHUB_OUTPUT
        echo "DEBUG: Frontend Public ip is: $PUBLIC_IP and ARN: $TASK_ARN"

    - name: Update README IPs
    run: |
      # 1. Setup Git identity
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 2. Extract the new IP from your previous step (Backend IP)
      # Note: This assumes you are getting the Backend IP earlier in the job
      NEW_BACKEND_IP="${{ steps.get-ip.outputs.ip }}"
      
      # 3. Use sed to replace the IPs in the README
      # Pattern 1: Finds the IP before :8000/docs
      sed -i "s/http:\/\/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}:8000/http:\/\/$NEW_BACKEND_IP:8000/g" README.md
      
      # Pattern 2: Finds the IP at the end of the sentence (Frontend IP)
      # Since Frontend usually has its own IP, replace it here if needed. 
      # If the Frontend IP is the same as Backend, use $NEW_BACKEND_IP.
      NEW_FRONTEND_IP="${{ steps.get-ip.outputs.frontendIp }}"
      sed -i "s/and http:\/\/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\} accordingly/and http:\/\/YOUR_FRONTEND_IP accordingly/g" README.md

      # 4. Commit and Push
      git add README.md
      git commit -m "docs: update deployment IPs [skip ci]"
      git push